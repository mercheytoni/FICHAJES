body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.4}

/* ---------- 2b. ESCRITOR XLSX MÍNIMO (sin librerías externas) ----------
   Genera un .xlsx real (zip + XML) con estilos, fórmulas (con su valor en caché),
   validación de datos, formato condicional y configuración de impresión. */
const XL = (() => {
  const enc = new TextEncoder();
  const CT = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); CT[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const x = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const xa = s => x(s).replace(/"/g, '&quot;');
  const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const ref = (r, c) => colName(c) + r;
  const serial = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / 864e5) + 25569;   // fecha → número de serie de Excel
  const HDR = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  let noCache = false;   // solo para pruebas: omite los valores en caché de las fórmulas

  /* ---- ZIP sin compresión ---- */
  const le = (n, b) => { const a = new Uint8Array(b); for (let i = 0; i < b; i++) a[i] = (n >>> (8 * i)) & 255; return a; };
  const cat = arr => { let L = 0; arr.forEach(a => L += a.length); const o = new Uint8Array(L); let p = 0; arr.forEach(a => { o.set(a, p); p += a.length; }); return o; };
  function zip(files) {
    const parts = [], cen = []; let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), cr = crc32(f.data), sz = f.data.length;
      const lh = cat([Uint8Array.of(0x50, 0x4b, 3, 4), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(cr, 4), le(sz, 4), le(sz, 4), le(nm.length, 2), le(0, 2), nm]);
      cen.push(cat([Uint8Array.of(0x50, 0x4b, 1, 2), le(20, 2), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(cr, 4), le(sz, 4), le(sz, 4), le(nm.length, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 4), le(off, 4), nm]));
      parts.push(lh, f.data); off += lh.length + sz;
    }
    const cd = cat(cen);
    const end = cat([Uint8Array.of(0x50, 0x4b, 5, 6), le(0, 2), le(0, 2), le(files.length, 2), le(files.length, 2), le(cd.length, 4), le(off, 4), le(0, 2)]);
    return cat([...parts, cd, end]);
  }

  /* ---- Estilos ---- */
  function Styles() {
    const fonts = [], fills = [], borders = [], nfs = [], xfs = [], dxfs = [];
    const idx = (arr, key) => { let i = arr.indexOf(key); if (i < 0) { i = arr.length; arr.push(key); } return i; };
    idx(fonts, '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>');
    idx(fills, '<fill><patternFill patternType="none"/></fill>');
    idx(fills, '<fill><patternFill patternType="gray125"/></fill>');
    idx(borders, '<border><left/><right/><top/><bottom/><diagonal/></border>');
    idx(xfs, '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>');
    const light = '<color rgb="FFCBD5E1"/>';
    const side = (n, st, c) => `<${n} style="${st}">${c}</${n}>`;
    return {
      /* o: {b,i,sz,color,fill,bd:'thin'|'total',nf,h,v,wrap} → índice de estilo */
      get(o) {
        o = o || {};
        const font = '<font>' + (o.b ? '<b/>' : '') + (o.i ? '<i/>' : '') + `<sz val="${o.sz || 11}"/><color rgb="FF${o.color || '0F172A'}"/><name val="Calibri"/><family val="2"/></font>`;
        const fill = o.fill ? `<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/><bgColor indexed="64"/></patternFill></fill>` : null;

      s.set(r, 5, r2(o + f), E.hrs, `C${r}+D${r}`);
      s.set(r, 6, e, E.hrs, `SUMIFS(${rangeF('F')},${rangeF('B')},$A${r})`);
      s.set(r, 7, r2(o - e), E.hrs, `C${r}-F${r}`);
    });
    const a = 5, b = 4 + keys.length, tr = 5 + keys.length;
    s.set(tr, 1, 'TOTAL', E.tTxt); s.set(tr, 2, null, E.tTxt);
    s.set(tr, 3, sum(rows, x => x.ord), E.tHrs, sumF('C', a, b)); s.set(tr, 4, sum(rows, x => x.fes), E.tHrs, sumF('D', a, b));
    s.set(tr, 5, sum(rows, x => x.ord + x.fes), E.tHrs, sumF('E', a, b));
    s.set(tr, 6, sum(rows, x => x.ext), E.tHrs, sumF('F', a, b)); s.set(tr, 7, sum(rows, x => x.ord - x.ext), E.tHrs, sumF('G', a, b));
    if (keys.length) s.cf.push({ sqref: `F5:F${b}`, op: 'greaterThan', f: '0', dxf: dxRed });
    return s;
  };
  tot(N.tts, 'Total de todos los trabajadores por semana', 'Semana del (lunes)', weeks, P, ps, PS, 'week');
  tot(N.ttm, 'Total de todos los trabajadores por mes', 'Mes', months, P, pm, PM, 'month');

  /* ===== 4-5. Por trabajador y semana / por trabajador y mes ===== */
  const per2 = (name, title, keyHead, limHead, rows, keyCol, limRef, last, isWeek) => {
    const s = SH(name, title, [30, 18, 15, 15, 15, 20, 17], ['Trabajador', keyHead, 'Horas ordinarias', 'Horas festivas', 'Horas totales', limHead, 'Ordinarias sin extra']);
    rows.forEach((g, i) => {
      const r = 5 + i;
      s.set(r, 1, g.emp, E.txt); s.set(r, 2, g.k, isWeek ? E.date : E.mon);
      s.set(r, 3, r2(g.ord), E.hrs, `SUMIFS(${dd('H')},${dd('A')},$A${r},${dd(keyCol)},$B${r})`);
      s.set(r, 4, r2(g.fes), E.hrs, `SUMIFS(${dd('I')},${dd('A')},$A${r},${dd(keyCol)},$B${r})`);
      s.set(r, 5, r2(g.ord + g.fes), E.hrs, `C${r}+D${r}`);
      s.set(r, 6, r2(g.ext), E.hrs, `MAX(0,C${r}-${limRef})`);
      s.set(r, 7, r2(g.ord - g.ext), E.hrs, `C${r}-F${r}`);
    });
    const a = 5, b = 4 + rows.length, tr = 5 + rows.length;
    s.set(tr, 1, 'TOTAL', E.tTxt); s.set(tr, 2, null, E.tTxt);
    s.set(tr, 3, sum(rows, x => x.ord), E.tHrs, sumF('C', a, b)); s.set(tr, 4, sum(rows, x => x.fes), E.tHrs, sumF('D', a, b));
    s.set(tr, 5, sum(rows, x => x.ord + x.fes), E.tHrs, sumF('E', a, b));
    s.set(tr, 6, sum(rows, x => x.ext), E.tHrs, sumF('F', a, b)); s.set(tr, 7, sum(rows, x => x.ord - x.ext), E.tHrs, sumF('G', a, b));
    if (rows.length) s.cf.push({ sqref: `F5:F${b}`, op: 'greaterThan', f: '0', dxf: dxRed });
  };
  per2(N.ts, 'Horas por trabajador y semana', 'Semana del (lunes)', 'Horas extra (sobre límite semanal)', PS, 'D', P.ls, psLast, true);
  per2(N.tm, 'Horas por trabajador y mes', 'Mes', 'Horas extra (sobre límite mensual)', PM, 'E', P.lm, pmLast, false);

  /* ===== 6. Detalle diario (base de todos los cálculos) ===== */
  const sD = SH(N.dd, 'Detalle diario de horas trabajadas', [30, 12, 12, 17, 10, 12, 13, 13, 13],
    ['Trabajador', 'Fecha', 'Día', 'Semana del (lunes)', 'Mes', 'Horas trabajadas', 'Tipo de día', 'Horas ordinarias', 'Horas festivas']);
  D.forEach((x, i) => {
    const r = 5 + i;
    sD.set(r, 1, x.emp, E.txt); sD.set(r, 2, x.sr, E.date); sD.set(r, 3, DAYN[x.w - 1], E.ctr);
    sD.set(r, 4, x.wk, E.date); sD.set(r, 5, x.mo, E.mon); sD.set(r, 6, x.h, E.hrs);
    sD.set(r, 7, x.fest ? 'Festivo' : 'Laborable', E.ctr,
      `IF(OR(COUNTIF(${HOLR},B${r})>0,AND(WEEKDAY(B${r},2)=6,OR(${P.sat}="SÍ",${P.sat}="SI")),AND(WEEKDAY(B${r},2)=7,OR(${P.dom}="SÍ",${P.dom}="SI"))),"Festivo","Laborable")`);
    sD.set(r, 8, x.ord, E.hrs, `IF(G${r}="Festivo",0,F${r})`);
    sD.set(r, 9, x.fes, E.hrs, `IF(G${r}="Festivo",F${r},0)`);
  });
  if (D.length) { sD.cf.push({ sqref: `G5:G${ddLast}`, op: 'equal', f: '"Festivo"', dxf: dxAmber }); sD.cf.push({ sqref: `I5:I${ddLast}`, op: 'greaterThan', f: '0', dxf: dxAmber }); }

  /* ===== 7. Parámetros (celdas amarillas editables) ===== */
  const sP = new XL.Sheet(N.par); sP.colsW = [46, 24, 66]; sP.landscape = false;
  sP.header = `&L&14&"-,Bold"${hf(company)}&R&10&"-,Regular"Parámetros de cálculo`;
  sP.footer = '&L&9FichajeGPS&C&9Página &P de &N&R&9Impreso el &D';
  sP.set(1, 1, company, E.title, null).merge(1, 1, 1, 3); sP.rowH.set(1, 26);
  sP.set(2, 1, 'Parámetros de cálculo', E.sub).merge(2, 1, 2, 3);
  sP.set(3, 1, 'Cambia solo las celdas amarillas: todas las hojas se recalculan solas. Horas festivas = horas trabajadas en sábado o domingo (si están activados) o en un día de la lista de festivos; no cuentan para el límite de horas extra. Horas extra = horas ordinarias por encima del límite semanal (lunes a domingo) o mensual (mes natural).', E.note).merge(3, 1, 3, 3);
  sP.rowH.set(3, 64);
  const prm = [
    [4, 'Empresa (aparece en las cabeceras)', company, E.inTxt, 'Se usa como título de todas las hojas y en la cabecera de impresión'],
    [5, 'Límite de horas ordinarias por semana', LIM_S, E.inCtr, 'Lo que supere este número de horas ordinarias en la semana son horas extra'],
    [6, 'Límite de horas ordinarias por mes', LIM_M, E.inCtr, 'Lo que supere este número de horas ordinarias en el mes son horas extra'],
    [7, 'El sábado cuenta como día festivo', 'SÍ', E.inCtr, 'Elige SÍ o NO'],
    [8, 'El domingo cuenta como día festivo', 'SÍ', E.inCtr, 'Elige SÍ o NO']
  ];
  prm.forEach(([r, l, v, s, n]) => { sP.set(r, 1, l, E.lbl); sP.set(r, 2, v, s); sP.set(r, 3, n, E.small); });
  sP.set(10, 1, 'Festivos (una fecha por fila; borra o añade las que necesites)', E.sub).merge(10, 1, 10, 3);
  sP.set(11, 1, 'Fecha', E.head); sP.set(11, 2, 'Descripción', E.head); sP.set(11, 3, 'Nota', E.head);
  for (let r = HOL_A; r <= HOL_B; r++) {
    const h = hol[r - HOL_A];
    sP.set(r, 1, h ? h.sr : null, E.inDate); sP.set(r, 2, h ? h.t : null, E.inTxt);
  }
  sP.set(HOL_A, 3, 'Están precargados los festivos nacionales. Añade los autonómicos y locales de tu zona.', E.small);
  sP.dv.push({ sqref: 'B5:B6', type: 'decimal', op: 'greaterThanOrEqual', f1: '0', title: 'Valor no válido', msg: 'Escribe un número de horas mayor o igual que 0.' });
  sP.dv.push({ sqref: 'B7:B8', type: 'list', f1: '"SÍ,NO"', title: 'Valor no válido', msg: 'Elige SÍ o NO.' });
  sheets.push(sP);

  /* ===== 8. Empleados ===== */
  const keys = []; emps.forEach(u => Object.keys(u.extras || {}).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  const sE = SH(N.emp, 'Datos de los empleados', [28, 32, 16, 34, 16, 16, 10, ...keys.map(() => 20)],
    ['Nombre', 'Email', 'Teléfono', 'Dirección', 'Alta en la empresa', 'Baja en la empresa', 'Estado', ...keys]);
  emps.forEach((u, i) => {
    const r = 5 + i;
    [u.nombre, u.email, u.telefono || '', u.direccion || '', u.fecha_alta ? fDateStr(u.fecha_alta) : '', u.fecha_baja ? fDateStr(u.fecha_baja) : '', u.activo ? 'Activo' : 'Inactivo', ...keys.map(k => (u.extras || {})[k] || '')]
      .forEach((v, c) => sE.set(r, c + 1, v, E.txt));
  });

  /* ===== 9. Fichajes (todos) ===== */
  const sF = SH(N.fic, 'Todos los fichajes', [12, 10, 28, 10, 12, 12, 13, 24],
    ['Fecha', 'Hora', 'Empleado', 'Tipo', 'Latitud', 'Longitud', 'Precisión (m)', 'Dispositivo']);
  all.forEach((r, i) => {
    const n = 5 + i;
    sF.set(n, 1, fDate(r.ts)); sF.set(n, 2, fTime(r.ts)); sF.set(n, 3, r.nombre); sF.set(n, 4, TIPOS[r.tipo].l);
    sF.set(n, 5, +r.latitud, E.lat); sF.set(n, 6, +r.longitud, E.lat);
    sF.set(n, 7, r.precision_gps != null ? Math.round(r.precision_gps) : null); sF.set(n, 8, r.dispositivo || '');
  });

  return XL.build(sheets, st);
}

/* ---------- 4. SESIÓN Y ROUTER ---------- */
async function applyPending(p){
  const r = p.tipo==='registro'
    ? await sb.rpc('registrar_empresa',{p_nombre_admin:p.nombre,p_nombre_empresa:p.empresa})
    : await sb.rpc('aceptar_invitacion',{p_token:p.token,p_nombre:p.nombre,p_empresa_nombre:p.empresa||null});
  if(r.error) throw r.error;
  return r.data;
}
async function loadSession(){
  const {data}=await sb.auth.getSession();
  S.session=data.session; S.perfil=null;
  if(!S.session) return;
  const q=await sb.from('usuarios').select('*').eq('id',S.session.user.id).maybeSingle();
  S.perfil=q.data||null;
  if(!S.perfil){
    let p=null; try{ p=JSON.parse(LS.get('fgps_pending')||'null'); }catch(e){}
    if(p){
      LS.del('fgps_pending');
      try{ await applyPending(p); const q2=await sb.from('usuarios').select('*').eq('id',S.session.user.id).maybeSingle(); S.perfil=q2.data||null; }
      catch(e){ toast(e.message,'err'); }
    }
  }
}
function go(p){ const t='#'+p; if(location.hash===t) route(); else location.hash=t; }

async function route(){
  clearTimers(); unsubscribeRT(); closeModal();
  const parts=(location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean);
  if(parts[0]==='setup') return renderSetup();
  if(!initSB()) return renderSetup();
  render(spinner());
  try{ await loadSession(); }catch(e){ toast(e.message,'err'); }
  if(parts[0]==='invite'&&parts[2]) return renderInvite(parts[2]);
  if(parts[0]==='login'){ if(S.perfil) return go('/app'); S.loginRole=parts[1]==='admin'?'admin':'employee'; return renderLogin(); }
  if(parts[0]==='app'){
    if(!S.session) return go('/');
    if(!S.perfil) return renderNoProfile();
    return S.perfil.rol==='admin' ? renderAdmin() : renderEmployee();
  }
  if(S.session&&S.perfil) return go('/app');
  if(S.session&&!S.perfil) return renderNoProfile();
  renderHome();
}
window.addEventListener('hashchange',route);

/* ---------- 6. PANEL DEL EMPLEADO ---------- */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('Tu dispositivo no soporta geolocalización.'));
    navigator.geolocation.getCurrentPosition(res,e=>{
      const m={1:'Permiso de ubicación denegado. Actívalo en los ajustes para poder fichar.',2:'No se pudo obtener la ubicación. Comprueba que el GPS esté activado.',3:'Tiempo de espera agotado al obtener el GPS. Inténtalo de nuevo.'};
      rej(new Error(m[e.code]||e.message));
    },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
function workedMs(listAsc){
  let ms=0,start=null;
  for(const f of listAsc){
    const t=new Date(f.ts).getTime();
    if(f.tipo==='entrada'||f.tipo==='reanudar') start=t;
    else if((f.tipo==='pausa'||f.tipo==='salida')&&start!==null){ ms+=t-start; start=null; }
  }
  if(start!==null) ms+=Date.now()-start;
  return ms;
}
const todayList = () => { const k=new Date().toDateString(); return S.mine.filter(f=>new Date(f.ts).toDateString()===k).reverse(); };

async function renderEmployee(){
  render(`<header class="top"><div class="brand">${LOGO}<span>FichajeGPS</span></div><button class="btn sm ghostw" data-act="logout">Salir</button></header><main class="wrap narrow" id="emp">${spinner()}</main>${credit()}`);

  }

function tickEmp(){
  const c=$('clock'); if(!c) return; const n=new Date();
  c.textContent=n.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const w=$('worked'); if(w) w.textContent=fmtDur(workedMs(todayList()));
}
function drawEmp(){
  const est=estadoDe(S.mine[0]&&S.mine[0].tipo);
  let hist='',last='';
  for(const f of S.mine){
    const day=fDay(f.ts); if(day!==last){ hist+=`<div class="day">${esc(day)}</div>`; last=day; }
    hist+=`<div class="item"><span class="badge b-${f.tipo}">${TIPOS[f.tipo].l}</span><span class="t">${fTime(f.ts)}</span><span class="sp mut small">${f.precision_gps!=null?'±'+Math.round(f.precision_gps)+' m':''}</span><a class="small" target="_blank" rel="noopener" href="${mapUrl(f.latitud,f.longitud)}">📍 mapa</a></div>`;
  }
  $('emp').innerHTML=`
    <div class="card">
      <p class="mut small" style="text-align:center">${esc(S.perfil.nombre)} · ${esc(S.empNombre)}</p>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      <span class="badge state b-${est}" style="font-size:.95rem;padding:6px 16px">${ESTADO_L[est]}</span>
      <div class="btns">
        <button class="btn green" data-act="fichar" data-tipo="entrada" ${est!=='fuera'?'disabled':''}>▶ Entrar</button>
        <button class="btn danger" data-act="fichar" data-tipo="salida" ${est==='fuera'?'disabled':''}>■ Salir</button>
        ${est==='pausa'
          ?'<button class="btn full" data-act="fichar" data-tipo="reanudar">⏵ Reanudar</button>'
          :`<button class="btn amber full" data-act="fichar" data-tipo="pausa" ${est!=='trabajando'?'disabled':''}>⏸ Pausa</button>`}
      </div>
      <p class="mut small" id="gps" style="text-align:center;margin-top:10px"></p>
      <div class="stat" style="margin-top:12px"><span class="mut">Trabajado hoy</span><b id="worked">0h 00m</b></div>
    </div>
    <div class="card"><h3>Mi historial</h3>${hist||'<div class="empty">Aún no tienes fichajes.</div>'}</div>`;
  tickEmp();
}

/* ---------- 7. PANEL DEL ADMINISTRADOR ---------- */
async function loadEmpresas(){
  const {data}=await sb.from('empresas').select('*').eq('creada_por',S.session.user.id).order('created_at');
  S.empresas=data||[];
  const saved=LS.get('fgps_emp');
  S.empresaId=(S.empresas.find(e=>e.id===S.empresaId)||S.empresas.find(e=>e.id===saved)||S.empresas[0]||{}).id||null;
  if(S.empresaId) LS.set('fgps_emp',S.empresaId);
}
async function loadEmps(){
  const {data}=await sb.from('usuarios').select('*').eq('empresa_id',S.empresaId).eq('rol','empleado').order('nombre');
  S.emps=data||[];
}
async function loadLive(){
  const since=new Date(Date.now()-48*3600e3).toISOString();
  const {data}=await sb.from('fichajes').select('*').eq('empresa_id',S.empresaId).gte('ts',since).order('ts',{ascending:false}).limit(500);
  S.live=data||[];
}
async function loadInvites(){
  const {data}=await sb.from('invitaciones').select('*').eq('creada_por',S.session.user.id).order('created_at',{ascending:false}).limit(50);
  S.invites=data||[];
}
function subscribeRT(){
  unsubscribeRT();
  if(!S.empresaId) return;
  S.channel=sb.channel('fichajes-'+S.empresaId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fichajes',filter:'empresa_id=eq.'+S.empresaId},p=>onNewFichaje(p.new))
    .subscribe(st=>{ S.rt=st; const el=$('rt'); if(el){ el.className='rt '+(st==='SUBSCRIBED'?'on':'off'); el.textContent=st==='SUBSCRIBED'?'● Tiempo real activo':'○ Conectando…'; } });
}
function onNewFichaje(f){
  S.live=[f,...S.live.filter(x=>x.id!==f.id)].slice(0,500);
  S.fresh=f.id; setTimeout(()=>{ S.fresh=null; },6000);
  if(!S.emps.some(u=>u.id===f.usuario_id)) loadEmps().then(()=>{ if(S.tab==='live') drawTab(); });
  if(S.tab==='live') drawTab();
  toast(`${f.nombre}: ${TIPOS[f.tipo].l.toLowerCase()}`,'ok');
}
async function renderAdmin(){
  render(`<header class="top"><div class="brand">${LOGO}<span>FichajeGPS</span></div><button class="btn sm ghostw" data-act="logout">Salir</button></header><main class="wrap">${spinner()}</main>`);
  await loadEmpresas();
  if(S.empresaId){ await Promise.all([loadEmps(),loadLive(),loadInvites()]); } else { S.emps=[]; S.live=[]; await loadInvites(); S.tab='empresas'; }
  render(`<header class="top"><div class="brand">${LOGO}<span>FichajeGPS</span></div>
      <div class="row">${S.empresas.length?`<label class="empsel"><span>Empresas</span><select data-change="setEmpresa">${S.empresas.map(e=>`<option value="${e.id}" ${e.id===S.empresaId?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></label>`:''}
      <button class="btn sm ghostw" data-act="logout">Salir</button></div></header>
    <main class="wrap"><nav class="tabs" id="tabs"></nav><div id="tab"></div>${credit()}</main>`);
  drawTabs(); drawTab();
  if(S.empresaId){
    subscribeRT();
    S.timers.push(setInterval(async()=>{ if(S.tab==='live'&&S.rt!=='SUBSCRIBED'){ try{ await loadLive(); drawTab(); }catch(e){} } },20000));
  }
}
function drawTabs(){
  const T=[['live','En vivo'],['fich','Fichajes'],['emps','Empleados'],['inv','Invitaciones'],['empresas','Empresas']];
  $('tabs').innerHTML=T.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
}
function drawTab(){
  const el=$('tab'); if(!el) return;
  if(!S.empresaId&&S.tab!=='empresas'&&S.tab!=='inv'){ el.innerHTML=`<div class="card empty">Primero crea una empresa en la pestaña «Empresas».</div>`; return; }
  el.innerHTML = ({live:tabLive,fich:tabFich,emps:tabEmps,inv:tabInv,empresas:tabEmpresas})[S.tab]();
  if(S.tab==='fich'&&!S.rows.length&&!S._searched){ S._searched=true; A.buscar($('fform')); }
}

function tabLive(){
  const last=new Map(); for(const f of S.live) if(!last.has(f.usuario_id)) last.set(f.usuario_id,f);
  const c={trabajando:0,pausa:0,fuera:0};
  const cards=S.emps.filter(u=>u.activo).map(u=>{
    const f=last.get(u.id), est=estadoDe(f&&f.tipo); c[est]++;
    return `<div class="emp"><b>${esc(u.nombre)}</b><span class="badge b-${est}">${ESTADO_L[est]}</span>
      <div class="mut small" style="margin-top:6px">${f?`${TIPOS[f.tipo].l} · ${fDate(f.ts)} ${fTime(f.ts)}<br><a target="_blank" rel="noopener" href="${mapUrl(f.latitud,f.longitud)}">📍 ver ubicación</a>`:'Sin fichajes recientes'}</div></div>`;
  }).join('');
  const feed=S.live.slice(0,40).map(f=>`<div class="item ${f.id===S.fresh?'new':''}"><span class="badge b-${f.tipo}">${TIPOS[f.tipo].l}</span><span class="sp"><div class="nm">${esc(f.nombre)}</div><div class="mut small">${fDate(f.ts)} · ±${f.precision_gps!=null?Math.round(f.precision_gps):'?'} m · ${esc(f.dispositivo||'')}</div></span><span class="t">${fTime(f.ts)}</span><a target="_blank" rel="noopener" href="${mapUrl(f.latitud,f.longitud)}">📍</a></div>`).join('');
  return `<div class="row between" style="margin-bottom:10px"><h2 style="margin:0">En vivo</h2><span id="rt" class="rt ${S.rt==='SUBSCRIBED'?'on':'off'}">${S.rt==='SUBSCRIBED'?'● Tiempo real activo':'○ Conectando…'}</span></div>
    <div class="counts"><div><strong style="color:var(--green)">${c.trabajando}</strong><span class="small mut">Trabajando</span></div><div><strong style="color:var(--amber)">${c.pausa}</strong><span class="small mut">En pausa</span></div><div><strong style="color:var(--red)">${c.fuera}</strong><span class="small mut">Fuera</span></div></div>
    <div class="emps">${cards||'<div class="card empty" style="grid-column:1/-1">Aún no hay empleados. Invítalos desde la pestaña «Invitaciones».</div>'}</div>
    <div class="card"><h3>Últimos fichajes</h3>${feed||'<div class="empty">Sin fichajes en las últimas 48 h.</div>'}</div>`;
}
function tabFich(){
  const f=S.flt||(S.flt={emp:'',desde:isoDay(new Date(Date.now()-6*864e5)),hasta:isoDay(new Date()),hd:'00:00',hh:'23:59',tipo:''});
  return `<div class="card"><h3>Filtros</h3><form id="fform" data-submit="buscar"><div class="filters">
    <label>Empleado<select name="emp"><option value="">Todos</option>${S.emps.map(u=>`<option value="${u.id}" ${u.id===f.emp?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></label>
    <label>Desde<input type="date" name="desde" value="${f.desde}"></label>
    <label>Hasta<input type="date" name="hasta" value="${f.hasta}"></label>
    <label>Hora desde<input type="time" name="hd" value="${f.hd}"></label>
    <label>Hora hasta<input type="time" name="hh" value="${f.hh}"></label>
    <label>Tipo<select name="tipo"><option value="">Todos</option>${Object.keys(TIPOS).map(k=>`<option value="${k}" ${k===f.tipo?'selected':''}>${TIPOS[k].l}</option>`).join('')}</select></label>
    <button class="btn" style="margin-bottom:10px">Buscar</button></div></form></div>
    <div id="res">${resHtml()}</div>`;
}
function resHtml(){
  if(!S.rows.length) return `<div class="card empty">Sin resultados.</div>`;
  return `<div class="row between" style="margin-bottom:8px"><span class="mut small">${S.rows.length} fichajes${S.rows.length>=1000?' (máx. 1000: acota el rango)':''}</span>
    <span class="row"><button class="btn sm ghost" data-act="expCsv">⬇ CSV</button><button class="btn sm ghost" data-act="expPdf">⬇ PDF</button><button class="btn sm green" data-act="expXlsx">⬇ Excel</button></span></div>
    <div class="tw"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Empleado</th><th>Tipo</th><th>Ubicación</th><th>Precisión</th><th>Dispositivo</th></tr></thead><tbody>
    ${S.rows.map(r=>`<tr><td>${fDate(r.ts)}</td><td>${fTime(r.ts)}</td><td>${esc(r.nombre)}</td><td><span class="badge b-${r.tipo}">${TIPOS[r.tipo].l}</span></td><td><a target="_blank" rel="noopener" href="${mapUrl(r.latitud,r.longitud)}">${(+r.latitud).toFixed(5)}, ${(+r.longitud).toFixed(5)}</a></td><td>${r.precision_gps!=null?'±'+Math.round(r.precision_gps)+' m':'—'}</td><td>${esc(r.dispositivo||'')}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function tabEmps(){
  return `<div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Empleados</h2><span class="row"><button class="btn sm green" data-act="expXlsx">⬇ Excel</button><button class="btn sm" data-act="newInvite" data-rol="empleado">+ Invitar empleado</button></span></div>
    ${S.emps.length?S.emps.map(u=>`<div class="card"><div class="row between"><div><b>${esc(u.nombre)}</b> ${u.activo?'':'<span class="badge">Inactivo</span>'} ${u.fecha_baja&&u.fecha_baja<=isoDay(new Date())?'<span class="badge b-salida">De baja</span>':''}<div class="mut small">${esc(u.email)}</div>${empDetails(u)}</div>
      <div class="row"><button class="btn sm ghost" data-act="editEmp" data-id="${u.id}">Editar</button><button class="btn sm ghost" data-act="toggleEmp" data-id="${u.id}">${u.activo?'Desactivar':'Activar'}</button><button class="btn sm danger" data-act="delEmp" data-id="${u.id}">Eliminar</button></div></div></div>`).join('')
      :'<div class="card empty">Todavía no hay empleados. Genera un enlace de invitación.</div>'}`;
}
function tabInv(){
  const now=Date.now();
  return `<div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Invitaciones</h2></div>
    <div class="card"><div class="row">
      ${S.empresaId?'<button class="btn" data-act="newInvite" data-rol="empleado">🔗 Enlace de empleado</button>':''}
      <button class="btn ghost" data-act="newInvite" data-rol="admin">🔗 Enlace de administrador</button></div>
      <p class="mut small" style="margin-top:8px">Los enlaces son únicos, caducan y tienen un rol fijo. El de empleado solo da acceso a su propio fichaje; el de administrador permite crear una empresa nueva.</p></div>
    ${S.invites.map(i=>{ const caduc=new Date(i.expira_en).getTime()<now, ago=i.usos>=i.max_usos; const emp=(S.empresas.find(e=>e.id===i.empresa_id)||{}).nombre;
      return `<div class="card"><div class="row between"><div><span class="badge ${i.rol==='admin'?'b-reanudar':'b-entrada'}">${i.rol==='admin'?'Administrador':'Empleado'}</span> ${caduc?'<span class="badge">Caducado</span>':ago?'<span class="badge">Agotado</span>':''}
      <div class="mut small" style="margin-top:4px">${emp?esc(emp)+' · ':''}Usos ${i.usos}/${i.max_usos} · caduca ${fDate(i.expira_en)}</div></div>
      <div class="row">${caduc||ago?'':`<button class="btn sm ghost" data-act="copy" data-val="${esc(inviteUrl(i.rol,i.token))}">Copiar</button>`}<button class="btn sm danger" data-act="delInv" data-id="${i.id}">Revocar</button></div></div></div>`; }).join('')||'<div class="card empty">No has creado invitaciones.</div>'}`;

function tabEmpresas(){
  return `<div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Empresas</h2><button class="btn sm" data-act="newEmpresa">+ Nueva empresa</button></div>
    ${S.empresas.map(e=>`<div class="card"><div class="row between"><div><b>${esc(e.nombre)}</b> ${e.id===S.empresaId?'<span class="badge b-entrada">Activa</span>':''}</div>
      <div class="row">${e.id===S.empresaId?'':`<button class="btn sm ghost" data-act="useEmpresa" data-id="${e.id}">Usar</button>`}<button class="btn sm ghost" data-act="renEmpresa" data-id="${e.id}">Renombrar</button><button class="btn sm danger" data-act="delEmpresa" data-id="${e.id}">Eliminar</button></div></div></div>`).join('')||'<div class="card empty">Crea tu primera empresa.</div>'}`;

/* ---------- 8. ACCIONES ---------- */
const A = {
  closeModal,
  async saveSetup(f){ const v=fd(f); LS.set('fgps_url',v.url.trim()); LS.set('fgps_key',v.key.trim()); LS.set('fgps_app',v.app.trim()); location.hash='#/'; location.reload(); },
  loginTab(el){ S.loginTab=el.dataset.t; renderLogin(); },
  invTab(el){ S.invMode=el.dataset.t; drawInvite(); },
  async doLogin(f){
    const v=fd(f); const {error}=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.password});
    if(error) throw new Error(authMsg(error));
    go('/app');
  },
  async doRegisterCompany(f){
    const v=fd(f); const {data,error}=await sb.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{nombre:v.nombre}}});
    if(error) throw new Error(authMsg(error));
    if(data.user&&data.user.identities&&data.user.identities.length===0) throw new Error('Ese email ya está registrado. Pulsa «Entrar».');
    const pend={tipo:'registro',nombre:v.nombre.trim(),empresa:v.empresa.trim()};
    if(data.session){ await applyPending(pend); toast('Empresa creada','ok'); go('/app'); }
    else { LS.set('fgps_pending',JSON.stringify(pend)); showInfo('Revisa tu correo','Te hemos enviado un enlace para confirmar tu email. Después de confirmarlo, inicia sesión y tu empresa se creará automáticamente.'); }
  },
  async doRegisterExisting(f){ const v=fd(f); await applyPending({tipo:'registro',nombre:v.nombre.trim(),empresa:v.empresa.trim()}); toast('Empresa creada','ok'); go('/app'); },
  async doInvite(f){
    const v=fd(f), d=S.inv; const pend={tipo:'invite',token:d.token,nombre:(v.nombre||'').trim()||(S.perfil&&S.perfil.nombre)||'',empresa:(v.empresa||'').trim()};
    if(!S.session){
      if(S.invMode==='login'){
        const {error}=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.password}); if(error) throw new Error(authMsg(error));
      } else {
        const {data,error}=await sb.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{nombre:v.nombre}}});
        if(error) throw new Error(authMsg(error));
        if(data.user&&data.user.identities&&data.user.identities.length===0) throw new Error('Ese email ya está registrado. Usa «Ya tengo cuenta».');
        if(!data.session){ LS.set('fgps_pending',JSON.stringify(pend)); return showInfo('Revisa tu correo','Confirma tu email con el enlace que te hemos enviado y luego inicia sesión: tu invitación se aplicará automáticamente.'); }
      }
    }
    await applyPending(pend);
    toast('¡Listo!','ok'); go('/app');
  },
  async logout(){ unsubscribeRT(); clearTimers(); await sb.auth.signOut(); S.session=null; S.perfil=null; S.tab='live'; S._searched=false; S.rows=[]; go('/'); },

  /* Empleado */
  async fichar(el){
    const tipo=el.dataset.tipo; el.classList.add('busy');
    try{
      toast('Obteniendo ubicación GPS…');
      const pos=await getPos();
      const {data,error}=await sb.rpc('fichar',{p_tipo:tipo,p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_precision:pos.coords.accuracy,p_dispositivo:deviceName()});
      if(error) throw error;
      S.mine.unshift(data); drawEmp();
      toast(`${TIPOS[tipo].l} registrada a las ${fTime(data.ts)}`,'ok');
    } finally { el.classList.remove('busy'); }
  },

  /* Administrador */
  tab(el){ S.tab=el.dataset.t; drawTabs(); drawTab(); },
  async setEmpresa(el){ S.empresaId=el.value; LS.set('fgps_emp',el.value); S.rows=[]; S._searched=false; S.flt=null; renderAdmin(); },
  async buscar(form){
    const f=fd(form); S.flt=f; const res=$('res'); if(res) res.innerHTML='<div class="spin">Buscando…</div>';
    let q=sb.from('fichajes').select('*').eq('empresa_id',S.empresaId).order('ts',{ascending:false}).limit(1000);
    if(f.desde) q=q.gte('ts',new Date(f.desde+'T00:00:00').toISOString());
    if(f.hasta) q=q.lte('ts',new Date(f.hasta+'T23:59:59.999').toISOString());
    if(f.emp) q=q.eq('usuario_id',f.emp);
    if(f.tipo) q=q.eq('tipo',f.tipo);
    const {data,error}=await q; if(error) throw error;
    const m=s=>{ const [h,mi]=(s||'0:0').split(':').map(Number); return h*60+mi; };
    const a=m(f.hd||'00:00'), b=m(f.hh||'23:59');
    S.rows=(data||[]).filter(r=>{ const d=new Date(r.ts); const t=d.getHours()*60+d.getMinutes(); return t>=a&&t<=b; });
    if($('res')) $('res').innerHTML=resHtml();
  },
  expCsv(){
    const safe=s=>/^[=+\-@]/.test(s)?"'"+s:s; const num=n=>String(n).replace('.',',');
    const rows=[['Fecha','Hora','Empleado','Tipo','Latitud','Longitud','Precisión (m)','Dispositivo'],
      ...S.rows.map(r=>[fDate(r.ts),fTime(r.ts),safe(r.nombre),TIPOS[r.tipo].l,num(r.latitud),num(r.longitud),r.precision_gps!=null?Math.round(r.precision_gps):'',safe(r.dispositivo||'')])];
    const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    download('fichajes_'+isoDay(new Date())+'.csv',csv,'text/csv;charset=utf-8');
  },
  async expPdf(){
    toast('Generando PDF…');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(!(window.jspdf&&window.jspdf.jsPDF.API.autoTable)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
    const doc=new window.jspdf.jsPDF({orientation:'landscape'});
    const emp=(S.empresas.find(e=>e.id===S.empresaId)||{}).nombre||'';
    doc.setFontSize(16); doc.text('FichajeGPS · Informe de fichajes',14,15);
    doc.setFontSize(10); doc.text(`${emp} · ${S.flt&&S.flt.desde||''} a ${S.flt&&S.flt.hasta||''} · ${S.rows.length} registros`,14,22);
    doc.autoTable({startY:27,styles:{fontSize:8},headStyles:{fillColor:[29,78,216]},
      head:[['Fecha','Hora','Empleado','Tipo','Latitud','Longitud','Precisión','Dispositivo']],
      body:S.rows.map(r=>[fDate(r.ts),fTime(r.ts),r.nombre,TIPOS[r.tipo].l,(+r.latitud).toFixed(6),(+r.longitud).toFixed(6),r.precision_gps!=null?'±'+Math.round(r.precision_gps)+' m':'',r.dispositivo||''])});
    doc.save('fichajes_'+isoDay(new Date())+'.pdf');
  },
  /* Ficha del empleado: datos personales + campos libres */
  editEmp(el){
    const u=S.emps.find(x=>x.id===el.dataset.id); if(!u) return;
    modal(`<h3>Datos del empleado</h3><p class="mut small" style="margin-bottom:10px">${esc(u.email)}</p>
      <form data-submit="saveEmp" data-id="${u.id}">
        <label>Nombre<input name="nombre" required value="${esc(u.nombre)}"></label>
        <label>Teléfono<input name="telefono" type="tel" value="${esc(u.telefono||'')}"></label>
        <label>Dirección<input name="direccion" value="${esc(u.direccion||'')}"></label>
        <div class="grid2">
          <label>Alta en la empresa<input name="fecha_alta" type="date" value="${esc(u.fecha_alta||'')}"></label>
          <label>Baja en la empresa<input name="fecha_baja" type="date" value="${esc(u.fecha_baja||'')}"></label>
        </div>
        <h3 style="margin-top:4px">Otros datos</h3>
        <div id="xrows">${Object.entries(u.extras||{}).map(([k,v])=>xrow(k,v)).join('')}</div>
        <button type="button" class="btn sm ghost" data-act="addExtra">+ Añadir campo</button>
        <div class="row end"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn">Guardar</button></div>
      </form>`);
  },
  addExtra(){
    const d=document.createElement('div'); d.innerHTML=xrow('','');
    $('xrows').appendChild(d.firstElementChild);
    const i=$('xrows').querySelector('.xrow:last-child input'); if(i) i.focus();
  },
  delExtra(el){ const r=el.closest('.xrow'); if(r) r.remove(); },
  async saveEmp(f){
    const g=n=>f.elements[n].value.trim();
    const alta=g('fecha_alta'), baja=g('fecha_baja');
    if(alta&&baja&&baja<alta) throw new Error('La fecha de baja no puede ser anterior a la de alta.');
    const extras={};
    f.querySelectorAll('.xrow').forEach(r=>{ const k=r.querySelector('[name=xk]').value.trim(), v=r.querySelector('[name=xv]').value.trim(); if(k) extras[k]=v; });
    const {error}=await sb.from('usuarios').update({nombre:g('nombre'),telefono:g('telefono')||null,direccion:g('direccion')||null,fecha_alta:alta||null,fecha_baja:baja||null,extras}).eq('id',f.dataset.id);
    if(error){
      if(/column|schema cache/i.test(error.message)) throw new Error('Falta ejecutar actualizacion_v2.sql en Supabase (SQL Editor).');
      throw error;
    }
    closeModal(); await loadEmps(); drawTab(); toast('Datos guardados','ok');
  },
  /* Excel completo y listo para imprimir: solo administrador */
  async expXlsx(){
    if(!S.perfil||S.perfil.rol!=='admin') throw new Error('Solo el administrador puede exportar a Excel.');
    if(!S.empresaId) throw new Error('Primero crea una empresa.');
    toast('Preparando el libro de Excel…');
    await loadEmps();
    let all=[], from=0; const size=1000;
    for(;;){
      const {data,error}=await sb.from('fichajes').select('*').eq('empresa_id',S.empresaId).order('ts',{ascending:true}).order('id').range(from,from+size-1);
      if(error) throw error;
      all=all.concat(data||[]);
      if(!data||data.length<size||all.length>=50000) break;
      from+=size;
    }
    const emp=(S.empresas.find(e=>e.id===S.empresaId)||{}).nombre||'Empresa';
    const bytes=buildHorasXlsx(emp,S.emps,all);
    download('FichajeGPS_'+emp.replace(/[^\w\-]+/g,'_')+'_'+isoDay(new Date())+'.xlsx',bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Excel generado: '+all.length+' fichajes','ok');
  },
  async toggleEmp(el){
    const u=S.emps.find(x=>x.id===el.dataset.id);
    const {error}=await sb.from('usuarios').update({activo:!u.activo}).eq('id',u.id); if(error) throw error;
    await loadEmps(); drawTab();
  },
  async delEmp(el){
    const u=S.emps.find(x=>x.id===el.dataset.id);
    if(!await confirmDlg(`¿Eliminar a ${u.nombre} y todos sus fichajes? No se puede deshacer.`)) return;
    const {error}=await sb.from('usuarios').delete().eq('id',u.id); if(error) throw error;
    await Promise.all([loadEmps(),loadLive()]); drawTab(); toast('Empleado eliminado','ok');
  },
  async newInvite(el){
    const rol=el.dataset.rol; if(rol==='empleado'&&!S.empresaId) throw new Error('Crea primero una empresa.');
    const v=await dialogForm(rol==='admin'?'Enlace de administrador':'Enlace de empleado',[
      {name:'dias',label:'Caduca en',type:'select',value:'7',options:[[1,'1 día'],[3,'3 días'],[7,'7 días'],[30,'30 días']]},
      {name:'usos',label:'Usos máximos',type:'number',value:'1',min:'1'}],'Generar enlace');
    if(!v) return;
    const token=randToken();
    const {error}=await sb.from('invitaciones').insert({token,rol,empresa_id:rol==='empleado'?S.empresaId:null,creada_por:S.session.user.id,
      expira_en:new Date(Date.now()+(+v.dias)*864e5).toISOString(),max_usos:Math.max(1,parseInt(v.usos)||1)});
    if(error) throw error;
    await loadInvites(); if(S.tab==='inv') drawTab();
    const url=inviteUrl(rol,token);
    modal(`<h3>Enlace generado</h3><p class="mut small" style="margin-bottom:10px">Válido para ${rol==='admin'?'un administrador':'un empleado'}. Envíalo por WhatsApp, email…</p>
      <input id="lk" readonly value="${esc(url)}" onclick="this.select()">
      <div class="row end"><button class="btn ghost" data-act="closeModal">Cerrar</button>${navigator.share?`<button class="btn ghost" data-act="shareLink" data-val="${esc(url)}">Compartir</button>`:''}<button class="btn" data-act="copy" data-val="${esc(url)}">Copiar</button></div>`);
  },
  async copy(el){ await copyText(el.dataset.val); toast('Enlace copiado','ok'); },
  async shareLink(el){ try{ await navigator.share({title:'FichajeGPS',text:'Tu invitación a FichajeGPS',url:el.dataset.val}); }catch(e){} },
  async delInv(el){
    if(!await confirmDlg('¿Revocar este enlace? Dejará de funcionar.','Revocar')) return;
    const {error}=await sb.from('invitaciones').delete().eq('id',el.dataset.id); if(error) throw error;
    await loadInvites(); drawTab();
  },
  async newEmpresa(){
    const v=await dialogForm('Nueva empresa',[{name:'nombre',label:'Nombre de la empresa'}],'Crear'); if(!v) return;
    const {data,error}=await sb.from('empresas').insert({nombre:v.nombre.trim(),creada_por:S.session.user.id}).select().single(); if(error) throw error;
    S.empresaId=data.id; LS.set('fgps_emp',data.id); S.tab='empresas'; toast('Empresa creada','ok'); renderAdmin();
  },
  async renEmpresa(el){
    const e=S.empresas.find(x=>x.id===el.dataset.id); const v=await dialogForm('Renombrar empresa',[{name:'nombre',label:'Nombre',value:e.nombre}]); if(!v) return;
    const {error}=await sb.from('empresas').update({nombre:v.nombre.trim()}).eq('id',e.id); if(error) throw error;
    S.tab='empresas'; renderAdmin();
  },
  async useEmpresa(el){ S.empresaId=el.dataset.id; LS.set('fgps_emp',el.dataset.id); S.rows=[]; S._searched=false; S.flt=null; S.tab='live'; renderAdmin(); },
  async delEmpresa(el){
    const e=S.empresas.find(x=>x.id===el.dataset.id);
    if(!await confirmDlg(`¿Eliminar la empresa «${e.nombre}» con todos sus empleados y fichajes? No se puede deshacer.`)) return;
    const {error}=await sb.from('empresas').delete().eq('id',e.id); if(error) throw error;
    if(S.empresaId===e.id) S.empresaId=null;
    S.tab='empresas'; S.rows=[]; S._searched=false; toast('Empresa eliminada','ok'); renderAdmin();
  }
};

/* ---------- 9. EVENTOS GLOBALES ---------- */
async function safe(fn,el,e){ try{ await fn(el,e); }catch(err){ toast((err&&err.message)||String(err),'err'); console.error(err); } }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-go]'); if(!el) return;
  if(el.dataset.go){ go(el.dataset.go); return; }
  const fn=A[el.dataset.act]; if(fn) safe(fn,el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-submit]'); if(!f) return; e.preventDefault();
  const fn=A[f.dataset.submit]; if(!fn) return;
  const btn=f.querySelector('button:not([type=button])'); if(btn) btn.classList.add('busy');
  safe(fn,f,e).finally(()=>{ if(btn) btn.classList.remove('busy'); });
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]'); if(!el) return;
  const fn=A[el.dataset.change]; if(fn) safe(fn,el,e);
});

/* ---------- 10. ARRANQUE ---------- */
window.addEventListener('load',()=>{ if(!window.supabase&&cfg().url){ render('<div class="wrap narrow"><div class="card"><h2>Sin conexión</h2><p>No se pudo cargar la librería de Supabase. Comprueba tu conexión a internet.</p></div></div>'); return; } route(); });
</script>
